# Builds GridGuardJA.apk on GitHub's servers and publishes it as the latest release.
# Runs on every push to main, or by hand from the Actions tab ("Run workflow").
# Needs one repository secret, ENV_FILE: the full contents of your .env file
# KEY=value lines and/or the Firebase config block pasted from the Firebase console.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check the ENV_FILE secret
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -z "$ENV_FILE" ]; then
            echo "::error::Add a repository secret named ENV_FILE (Settings > Secrets and variables > Actions) with the contents of your .env file, then re-run this workflow."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: |
          npm install --legacy-peer-deps
          npx expo install --fix -- --legacy-peer-deps

      - name: Write .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: node scripts/write-env.js

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build the APK
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../GridGuardJA.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: GridGuard JA build ${{ github.run_number }}
          body: Download GridGuardJA.apk below and open it on your Android phone to install.
          files: GridGuardJA.apk
          make_latest: true
